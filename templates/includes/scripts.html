{% load static %}
<!--   Core JS Files   -->
<script src="{% static 'js/core/jquery.min.js' %}"></script>
<script src="{% static 'js/core/popper.min.js' %}"></script>
<script src="{% static 'js/core/bootstrap.min.js' %}"></script>
<script src="{% static 'js/plugins/perfect-scrollbar.jquery.min.js' %}"></script>
<script src="{% static 'js/plugins/chartjs.min.js' %}"></script>
<script src="{% static 'js/now-ui-dashboard.min.js' %}" type="text/javascript"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@2.9.3/dist/Chart.min.js"></script>
<script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@2.9.3/dist/Chart.min.js"></script>
<script>

    $(function () {

        var $tempChart = $("#presChart");
        $.ajax({
            url: $tempChart.data("url"),
            success: function (data) {

                var ctx = $tempChart[0].getContext("2d");

                new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: [{% for item in data.labels %} '{{ item }}', {% endfor %}],
            datasets: [{
                label: 'Pressure',
                backgroundColor: '#F86332',
                data: [{% for item in data.pres %} '{{ item }}', {% endfor %}]
                        }]
                    },
        options: {
        responsive: true,
        legend: {
            position: 'top',
            display: false
        },
        scales: {
            yAxes: [{
                display: true,
                ticks: {
                    suggestedMin: 1010,    // minimum will be 0, unless there is a lower value.
                    // OR //
                    suggestedMax: 1018   // maxium value will be 100.
                }
            }]
        }
        // title: {
        //     display: true,
        //     text: 'Temperature Bar Chart'
        // }
    }
                });

            }
        });

    });

</script>

});
